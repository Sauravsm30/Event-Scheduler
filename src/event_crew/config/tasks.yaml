schedule_events:
  description: >
    You have been provided with EXACTLY these events: {{events}}.
    CRITICAL INSTRUCTION: You MUST ONLY schedule these exact events. DO NOT make up, create, or hallucinate ANY new events, names, or IDs under any circumstances.
    If an event does not have a strict start_time or end_time, you are free to schedule it at ANY appropriate available time.
    If you cannot schedule all events, just schedule what you can and state that the rest failed.
  expected_output: >
    A structured schedule mapping the provided events ONLY to time slots.
  agent: event_scheduler
  output_file: output/event_schedule.md

allocate_venues:
  description: >
    You have been provided with EXACTLY these venues: {{venues}}.
    CRITICAL INSTRUCTION: Assign ONLY these existing venues to the scheduled events. Respect their capacities and availability.
    If an event does not explicitly specify a 'preferred venue', you should automatically assume ANY available venue that fits the capacity requirements can be used.
    DO NOT invent, fabricate, or create new venues under any circumstances. If an event cannot find a venue, mark it as un-venued.
  expected_output: >
    Event-to-venue assignment mapping ONLY using existing provided venues.
  agent: venue_manager
  output_file: output/event_schedule.md

assign_volunteers:
  description: >
    You have been provided with EXACTLY these volunteers: {{volunteers}}.
    CRITICAL INSTRUCTION: Assign ONLY these existing volunteers to events. 
    DO NOT invent, fabricate, or hallucinate new names, volunteers, or skills. If an event is understaffed, do not make up people to fill it.
  expected_output: >
    Volunteer-to-event assignment mapping ONLY using existing provided volunteers.
  agent: volunteer_assigner
  output_file: output/event_schedule.md

resolve_conflicts:
  description: >
    Identify and resolve conflicts in schedules, venues, or volunteers.
    CRITICAL INSTRUCTION: Use ONLY the existing data. Never resolve a conflict by inventing new resources.
  expected_output: >
    A corrected plan using ONLY the explicitly provided input data.
  agent: conflict_resolver
  output_file: output/event_schedule.md

adaptive_replanning:
  description: >
    Adjust assignments if necessary, while minimizing disruption.
    CRITICAL INSTRUCTION: You must strictly stick to the inputted data pool.
  expected_output: >
    Updated schedule using only provided inputs.
  agent: adaptive_replanner
  output_file: output/event_schedule.md

explain_decisions:
  description: >
    Explain why each scheduling, venue, and volunteer decision was made.
    Strictly base your explanation on the provided {{events}}, {{venues}}, and {{volunteers}}. Do not reference hallucinated data.
  expected_output: >
    Human-readable explanations of the real schedule.
  agent: decision_explainer
  output_file: output/event_schedule.md
