schedule_events:
  description: >
    You have been provided with EXACTLY these events: {{events}}.
    You have been provided with the following program details: {{program}}. CRITICAL INSTRUCTION: You MUST use the program's start_date and end_date as the boundary for all event scheduling.
    CRITICAL INSTRUCTION: You MUST ONLY schedule these exact events. DO NOT make up, create, or hallucinate ANY new events, names, or IDs under any circumstances.
    If an event does not have a strict start_time or end_time, you are free to schedule it at ANY appropriate available time within the program dates.
    If you cannot schedule all events, just schedule what you can and state that the rest failed.
  expected_output: >
    A structured schedule mapping the provided events ONLY to time slots.
  agent: event_scheduler
  output_file: output/event_schedule.md

allocate_venues:
  description: >
    You have been provided with EXACTLY these venues: {{venues}}.
    CRITICAL INSTRUCTION: Assign ONLY these existing venues to the scheduled events. Respect their capacities and availability.
    If an event does not explicitly specify a 'preferred venue', you should automatically assume ANY available venue that fits the capacity requirements can be used.
    DO NOT invent, fabricate, or create new venues under any circumstances. 
    CRITICAL: You MUST ensure that the venue logically makes sense for the event's Domain. NEVER assign an event to a completely illogical venue (e.g., assigning a 'tech' Hackathon to a 'sports' Basketball Court) just for the sake of scheduling it! If an event cannot find a logically appropriate venue, you MUST exclude the event from the schedule or leave its scheduled_venue_id as null.
  expected_output: >
    Event-to-venue assignment mapping ONLY using existing provided venues.
  agent: venue_manager
  output_file: output/event_schedule.md

assign_volunteers:
  description: >
    You have been provided with EXACTLY these volunteers: {{volunteers}}.
    CRITICAL INSTRUCTION: Assign ONLY these existing volunteers to events. 
    DO NOT invent, fabricate, or hallucinate new names, volunteers, or skills. If an event is understaffed, do not make up people to fill it.
  expected_output: >
    Volunteer-to-event assignment mapping ONLY using existing provided volunteers.
  agent: volunteer_assigner
  output_file: output/event_schedule.md

resolve_conflicts:
  description: >
    Identify and resolve conflicts in schedules, venues, or volunteers.
    CRITICAL INSTRUCTION: Use ONLY the existing data. Never resolve a conflict by inventing new resources.
    IMPORTANT: If there are unresolvable conflicts that force you to break constraints (like double-booking a venue or missing a venue entirely), you MUST include the exact string 'FATAL_UNRESOLVABLE_CONFLICT' anywhere in your final output.
    If an event could not be assigned a valid, logical venue in the previous step, you MUST completely remove that event from the final schedule. Do not output it with a null venue.
  expected_output: >
    A corrected plan using ONLY the explicitly provided input data.
  agent: conflict_resolver
  output_file: output/event_schedule.md

adaptive_replanning:
  description: >
    Adjust assignments if necessary, while minimizing disruption.
    You MUST prioritize this constraint: {{human_prompt_text}}
    If there is an existing schedule provided here: {{current_schedule}}, use it as your baseline and ONLY change what is absolutely necessary.
    CRITICAL INSTRUCTION: You must strictly stick to the inputted data pool.
  expected_output: >
    Updated schedule using only provided inputs.
  agent: adaptive_replanner
  output_file: output/event_schedule.md

explain_decisions:
  description: >
    Explain why each scheduling, venue, and volunteer decision was made.
    Strictly base your explanation on the provided {{events}}, {{venues}}, {{volunteers}}, and {{program}} constraints. Do not reference hallucinated data.
    IMPORTANT: If you encounter unresolvable conflicts or the string 'FATAL_UNRESOLVABLE_CONFLICT' in the previous step, you MUST output a valid JSON object containing exactly this: {"schedule": [], "explanations": "FATAL_UNRESOLVABLE_CONFLICT"}
    OTHERWISE, you must output a valid JSON object containing TWO keys: "schedule" (which is the final array of event JSON objects) and "explanations" (which is your string explanation of the decisions).
  expected_output: >
    A strict JSON object in this format: {"schedule": [{"event_id": "...", "date": "YYYY-MM-DD", "scheduled_venue_id": "...", "volunteer_ids": ["..."], "start_time": "...", "end_time": "..."}], "explanations": "Your detailed explanation here."}
  agent: decision_explainer
  output_file: output/event_schedule.json
